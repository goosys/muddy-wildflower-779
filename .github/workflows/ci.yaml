name: CI
on:
  push:
    branches:
      - master
      - main
  pull_request:

env:
  RUST_TOOLCHAIN: beta-2026-09-29

permissions:
  contents: read

jobs:
  rust:
    name: Check Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          targets: wasm32-unknown-emscripten
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: >-
          cargo clippy --locked --all-targets --
          -D warnings -W clippy::pedantic -W clippy::nursery -W rust-2018-idioms
      - name: Run host tests
        run: cargo test --locked

  workers:
    name: Build and Test Emscripten Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          targets: wasm32-unknown-emscripten
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned worker-build
        run: >-
          cargo install worker-build
          --git https://github.com/cloudflare/workers-rs
          --rev b57ba6ef8198c65499c2f92b1845cc2412dd6e8c --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run local HTTP smoke tests
        run: |
          pnpm exec wrangler dev --ip 127.0.0.1 --port 8787 > /tmp/workers-dev.log 2>&1 &
          server_pid=$!
          cleanup() {
            status=$?
            kill "$server_pid" 2>/dev/null || true
            if [ "$status" -ne 0 ]; then cat /tmp/workers-dev.log; fi
          }
          trap cleanup EXIT
          for attempt in {1..60}; do
            if curl --silent --fail --max-time 2 http://127.0.0.1:8787/ > /dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then exit 1; fi
            sleep 1
          done
          curl --silent --fail --max-time 2 http://127.0.0.1:8787/ > /dev/null
          pnpm test
