[package]
name = "haikunator-worker"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
worker = { git = "https://github.com/cloudflare/workers-rs", rev = "b57ba6ef8198c65499c2f92b1845cc2412dd6e8c", features = ["http", "experimental_tokio"] }
axum = { version = "0.8", default-features = false, features = ["json"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
haikunator = "0.1.2"
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
tokio = { version = "1.41", default-features = false, features = ["rt", "macros", "time", "sync"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[patch.crates-io]
tokio = { git = "https://github.com/guybedford/tokio", rev = "7227f2d72739c3bc9821074cc704e7582be92907" }

[profile.release]
opt-level = "s"
panic = "abort"
